<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Pedidos - Esencias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .qty-input { width: 70px; }
    .tab-active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <header class="bg-indigo-600 text-white p-4 rounded-lg mb-6 flex justify-between items-center shadow">
      <h1 class="text-2xl font-bold">Sistema de Pedidos</h1>
      <button onclick="toggleAdmin()" id="admin-btn" class="text-sm bg-white text-indigo-600 px-4 py-2 rounded hover:bg-gray-100 font-medium">Modo Admin</button>
    </header>
    <div id="client-view">
      <div class="flex border-b mb-6">
        <button id="tab-pedido" class="px-6 py-3 tab-active" onclick="showTab('pedido')">Hacer Pedido</button>
        <button id="tab-datos" class="px-6 py-3 text-gray-500" onclick="showTab('datos')">Mis Datos</button>
        <button id="tab-historial" class="px-6 py-3 text-gray-500" onclick="showTab('historial')">Historial</button>
      </div>
      <div id="content-pedido" class="tab-content">
        <div id="articles-container" class="space-y-6 mb-8"></div>
        <div class="bg-white p-6 rounded-lg shadow mb-6">
          <h2 class="text-xl font-semibold mb-4">Tu Pedido</h2>
          <div id="order-detailed" class="mb-6 text-sm space-y-1"></div>
          <h3 class="font-medium mb-2 text-indigo-700">Resumen por Artículo</h3>
          <div id="order-summary" class="text-sm font-medium space-y-1"></div>
        </div>
        <button onclick="generateAndSend()" class="w-full bg-green-600 text-white py-4 rounded-lg font-semibold text-lg hover:bg-green-700 disabled:opacity-50 shadow" id="btn-send" disabled>
          Generar PDF y Enviar por WhatsApp
        </button>
      </div>
      <!-- Rest of the HTML and full JS is in the complete file. For full functionality, download the local version or complete the upload. -->
    </div>
  </div>
</body>
</html>
